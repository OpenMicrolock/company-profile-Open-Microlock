<svg xmlns="http://www.w3.org/2000/svg" width="300" height="92" viewBox="0 0 300 92" role="img" aria-label="Get it for iOS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4ff"/>
      <stop offset="1" stop-color="#6a5cff"/>
    </linearGradient>
  </defs>

  <!-- Badge body -->
  <rect x="1.5" y="1.5" width="297" height="89" rx="16" fill="url(#bg)" stroke="#a6a6a6" stroke-width="2"/>

  <!-- Download icon -->
  <circle cx="58" cy="46" r="26" fill="url(#accent)"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 33 V53"/>
    <path d="M49 45 L58 54 L67 45"/>
    <path d="M48 62 H68"/>
  </g>

  <!-- Text -->
  <text x="102" y="38" fill="#ffffff" fill-opacity="0.85" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1">Get it for</text>
  <text x="100" y="74" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="0.5">iOS</text>
</svg>
